# Security response headers, included by nginx.conf (server block and the static-asset
# location: an add_header in a location replaces every header inherited from the server).
# `vite preview` reads this file too (vite.config.ts), so a local preview serves the same policy.
#
# CSP notes:
# - script-src 'self': the production build has no inline scripts.
# - style-src keeps 'unsafe-inline': React style props and the motion library set inline style attributes.
# - connect-src 'self': nginx proxies /api and /ws on this origin. A build with VITE_API_BASE_URL or
#   VITE_WS_URL pointing at another origin must add that origin here.
# - require-trusted-types-for 'script': the app writes no HTML strings into the DOM.
# HSTS belongs where TLS terminates; this server listens on plain HTTP behind it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
